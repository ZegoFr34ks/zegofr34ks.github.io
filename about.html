<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAIZAH os Boot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: black;
      color: white;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    .frame {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 2px solid red;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 4px red) blur(0.8px);
      transition: opacity 1s ease;
    }

    .console {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: perspective(1000px) scale(1.1);
      backdrop-filter: blur(1px);
      transition: opacity 1s ease;
    }

    .console pre {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scale(1.3);
      color: #a0a0a0;
      opacity: 0.2;
      font-size: 2.6em;
      white-space: pre-wrap;
      width: 100%;
      text-align: left;
      text-shadow: 1px 1px 0 #ff0000, -1px -1px 0 #00ffff;
      filter: url(#fisheye);
    }

    .center-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      filter: drop-shadow(0 0 4px red) blur(0.5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease;
    }

    .logo {
      font-size: 10em; /* Even bigger title */
      color: red;
      margin-bottom: 30px;
      text-shadow: 1px 1px 0 #ff0000, -1px -1px 0 #00ffff;
    }

    .loading-bar-container {
      width: 90%; /* Longer than title */
      border: 1px solid red;
      padding: 5px;
      background: rgba(255, 0, 0, 0.1);
      filter: drop-shadow(0 0 4px red) blur(0.6px);
      margin-bottom: 20px;
    }

    .loading-bar {
      height: 20px;
      background: red;
      width: 0;
      transition: width 0.3s ease;
      filter: drop-shadow(0 0 4px red) blur(0.6px);
    }

    .loading-text {
      font-size: 1.5em;
      text-shadow: 1px 1px 0 #ff0000, -1px -1px 0 #00ffff;
      margin-bottom: 20px;
    }

    .button-wrapper {
      height: 0; /* Reserve space so layout doesn't shift when button appears */
      margin-top: 30px;
    }

    .enter-btn {
      padding: 10px 30px;
      border: 2px solid red;
      background: transparent;
      color: white;
      font-size: 1.8em;
      cursor: pointer;
      text-shadow: 1px 1px 0 #ff0000, -1px -1px 0 #00ffff;
      transition: 0.3s ease;
      filter: drop-shadow(0 0 4px red) blur(0.6px);
      display: none;
    }

    .enter-btn:hover {
      background: red;
      color: black;
    }

    .fade-out {
      opacity: 0;
    }

    .circle-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      border: 5px solid rgba(255, 0, 0, 0.5);
      border-top: 5px solid red;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      filter: drop-shadow(0 0 4px red) blur(0.6px);
      opacity: 1;
      transition: opacity 1s ease;
      display: none;
    }

    .circle-fade-out {
      opacity: 0;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    svg { display: none; }
  </style>
</head>
<body>
  <div class="frame" id="frame"></div>
  <div class="console" id="console">
    <pre id="console-text"></pre>
  </div>

  <div class="center-container" id="mainContent">
    <div class="logo">KAIZAH os</div>
    <div class="loading-bar-container">
      <div class="loading-bar" id="bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Initializing...</div>
    <div class="button-wrapper">
      <button class="enter-btn" id="enterBtn">ENTER SYSTEM</button>
    </div>
  </div>

  <div id="circleLoader" class="circle-loader"></div>

  <svg>
    <filter id="fisheye">
      <feTurbulence type="turbulence" baseFrequency="0.005" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <script>
    const messages = [
      "Booting KAIZAH os...",
      "Loading system modules...",
      "Authenticating BIOS...",
      "Syncing internal protocols...",
      "Checking memory sectors...",
      "Establishing uplink...",
      "Decrypting boot files...",
      "Initializing VGA kernel...",
      "Running diagnostics...",
      "Finalizing setup...",
    ];

    const consoleLines = [
      "[OK] Initializing subsystems",
      "[OK] /mnt/root mounted",
      "[INFO] Kernel build: v0.9.3-1984",
      "[BOOT] Parallel port registered",
      "[SYS] Loading drivers...",
      "[WARN] Legacy protocols detected",
      "[OK] Memory check: PASSED",
      "[AUTH] User profile injected"
    ];

    let i = 0;
    const bar = document.getElementById("bar");
    const text = document.getElementById("loading-text");
    const btn = document.getElementById("enterBtn");
    const consoleText = document.getElementById("console-text");
    const mainContent = document.getElementById("mainContent");
    const frame = document.getElementById("frame");
    const consoleDiv = document.getElementById("console");
    const circleLoader = document.getElementById("circleLoader");

    let consoleIndex = 0;
    function displayConsoleLines() {
      if (consoleIndex < consoleLines.length) {
        consoleText.innerText += consoleLines[consoleIndex++] + "\n";
        setTimeout(displayConsoleLines, 400);
      }
    }

    displayConsoleLines();

    function updateLoading() {
      if (i < messages.length) {
        text.innerText = messages[i];
        bar.style.width = `${(i + 1) * 10}%`;
        i++;
        setTimeout(updateLoading, 600);
      } else {
        text.innerText = "Boot complete.";
        btn.style.display = "inline-block";
        bar.style.width = "100%";
      }
    }

    setTimeout(updateLoading, 600);

    btn.addEventListener('click', () => {
      mainContent.classList.add('fade-out');
      frame.classList.add('fade-out');
      consoleDiv.classList.add('fade-out');
      setTimeout(() => {
        mainContent.style.display = 'none';
        frame.style.display = 'none';
        consoleDiv.style.display = 'none';
        circleLoader.style.display = 'block';
        setTimeout(() => {
          circleLoader.classList.add('circle-fade-out');
          setTimeout(() => {
            circleLoader.style.display = 'none';
            document.body.style.backgroundColor = 'black';
          }, 1000);
        }, 2000);
      }, 1000);
    });
  </script>
</body>
</html>
