<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YZK LP3 BETA</title>
  <link rel="stylesheet" href="assets/player.css" />
</head>

<body>
  <!-- Top Header -->
  <header class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="Home">
      <!-- simple home icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v10h-5v-6H11v6H6V11H3z"/></svg>
    </button>

    <div class="brand" aria-label="Player name">
      <div class="brand-title">YZK LP3 BETA</div>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btnSort" aria-label="Sort">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h6v-2H3v2zm0-5h12v-2H3v2zM3 8h18V6H3v2z"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.5a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.06.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
      </button>
      <button class="icon-btn is-disabled" aria-label="Profile (coming soon)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.42 0-8 2-8 4.5V21h16v-2.5C20 16 16.42 14 12 14z"/></svg>
      </button>
    </div>
  </header>

  <!-- Song list -->
  <main class="content">
    <!-- Search bar (replaces "Songs" + swipe hint) -->
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 18a8 8 0 1 1 5.29-14.01A8 8 0 0 1 10 18zm0-2a6 6 0 1 0-4.24-1.76A6 6 0 0 0 10 16zm8.71 4.29-4.1-4.1 1.41-1.41 4.1 4.1-1.41 1.41z"/>
        </svg>

        <input id="searchInput" type="search" inputmode="search"
          placeholder="Search songs or artists…"
          autocomplete="off" />

        <button id="searchClear" class="search-clear" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"></path>
          </svg>
        </button>
      </div>
    </div>


    <section id="songList" class="song-list" aria-label="Song list">
      <!-- rendered by JS -->
    </section>

    <div class="bottom-safe-space"></div>
  </main>

  <!-- Mini Player (only visible when playing) -->
  <div class="mini-player" id="miniPlayer" role="button" tabindex="0" aria-label="Open player">
    <div class="mini-top">
      <div class="mini-handle" aria-hidden="true"></div>
    </div>

    <div class="mini-body">
      <img class="mini-cover" id="miniCover" alt="Cover" />
      <div class="mini-meta">
        <div class="mini-title" id="miniTitle">—</div>
        <div class="mini-artist" id="miniArtist">—</div>
      </div>

      <button class="icon-btn mini-like" id="miniLike" aria-label="Like">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.35-9.5-8.5C.68 9.01 2.4 6 5.7 6c1.86 0 3.06 1.02 3.8 2.02C10.24 7.02 11.44 6 13.3 6c3.3 0 5.02 3.01 3.2 6.5C19 16.65 12 21 12 21z"/></svg>
      </button>

      <button class="icon-btn mini-play" id="miniPlayPause" aria-label="Play/Pause">
        <svg id="miniPlayIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <!-- progress bar (no numbers here) -->
    <div class="mini-progress">
      <div class="mini-progress-fill" id="miniProgressFill"></div>
    </div>
  </div>

  <!-- Full Player Bottom Sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

  <section class="sheet" id="playerSheet" aria-label="Player">
    <div class="sheet-top">
      <button class="sheet-chevron" id="btnSheetClose" aria-label="Minimize player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>
    </div>

    <div class="sheet-content">
      <img class="sheet-cover" id="sheetCover" alt="Cover" />

      <div class="sheet-meta">
        <button class="linkish sheet-title" id="sheetTitle" type="button">—</button>
        <button class="linkish sheet-artist" id="sheetArtist" type="button">—</button>
        <div class="sheet-desc" id="sheetDesc">—</div>
      </div>

      <!-- Seekbar with time -->
      <div class="seek">
        <input id="seekBar" class="seekbar" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <div class="seek-times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <!-- upnext-slot -->
      <div id="upNextSlot"></div>

      <!-- Main Controls -->
      <div class="controls">
        <button class="icon-btn" id="btnShuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5h-2V6.41l-3.29 3.3-1.42-1.42L17.59 5H16V3zM4 4h4.59l10 10H20v2h-2.41l-10-10H4V4zm16 16h-5v-2h1.59l-3.29-3.29 1.42-1.42L19 17.59V16h2v5zM4 18h4.59l2.3-2.29 1.41 1.41L9.41 20H4v-2z"/></svg>
        </button>

        <button class="icon-btn" id="btnPrev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
        </button>

        <button class="play-btn" id="btnPlayPause" aria-label="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="icon-btn" id="btnNext" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l11-6z"/></svg>
        </button>

        <button class="icon-btn" id="btnLoop" aria-label="Loop">
          <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4V6H7v4L3 6l4-4v3h10V1zM7 23l-4-4 4-4v3h10v-4l4 4-4 4v-3H7v4z"/></svg>
        </button>
      </div>

      <!-- Secondary Buttons -->
      <div class="sub-controls">
        <button class="pill" id="btnSpeed" type="button">1×</button>
        <button class="pill" id="btnQueue" type="button">Queue</button>
        <button class="pill" id="btnFormat" type="button">Format</button>
        <button class="pill" id="btnInfo" type="button">Info</button>

        <button class="icon-btn like-btn" id="sheetLike" aria-label="Like">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.35-9.5-8.5C.68 9.01 2.4 6 5.7 6c1.86 0 3.06 1.02 3.8 2.02C10.24 7.02 11.44 6 13.3 6c3.3 0 5.02 3.01 3.2 6.5C19 16.65 12 21 12 21z"/></svg>
        </button>
      </div>

      <div class="copyright">Copyright © 2026. All rights reserved to YZKSTUDIOS</div>
    </div>
  </section>

  <!-- Small popup / panel for sort + settings + info (simple start) -->
  <div class="panel-backdrop" id="panelBackdrop" hidden></div>
  <aside class="panel" id="panel" aria-label="Panel" hidden>
    <div class="panel-head">
      <div class="panel-title" id="panelTitle">Panel</div>
      <button class="icon-btn" id="panelClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24"><path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <!-- Audio element -->
  <audio id="audio" preload="metadata"></audio>
  <audio id="audioPreload" preload="auto"></audio>

  <script src="assets/player.js"></script>
  
</body>
</html>
